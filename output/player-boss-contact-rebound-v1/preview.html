<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#10181a}#note{position:fixed;left:6px;bottom:6px;z-index:100;background:#10181ae8;color:#fff;font:11px monospace;padding:5px;max-width:94%}</style><iframe src="../nimushi-boss-art-v1/resolution-review-v1/live.html"></iframe><div id="note">Waiting for actual Boss contact…</div><script type="module">
if(!import.meta.env.DEV)throw Error('Dev preview only');
const f=document.querySelector('iframe');
await new Promise(resolve=>{const i=setInterval(()=>{if(f.contentWindow.artReview){clearInterval(i);resolve()}},100)});
const a=f.contentWindow.artReview,w=a.frame,s=w.__dev.scene;
a.select({resolution:'256',alignment:'B',overlay:false});
const image=new Image();image.src='boss_contact_rebound_00.png';await image.decode();s.textures.addImage('boss-contact-rebound-candidate',image).setFilter(1);
let captured=false;
const previous=w.__dev.bridge.onEvent;
w.__dev.bridge.onEvent=(event,m)=>{
 previous(event,m);
 if(captured||event.type!=='hurt'||m.health.lastDamage?.cause!=='bossContact')return;
 const b=m.boss.contactBox,p=m.player;
 if(!(p.x+9>b.x&&p.x-9<b.x+b.width&&p.y+15>b.y&&p.y-15<b.y+b.height))return;
 captured=true;
 // Stop at the existing collision event. No actor position, velocity, HP or collision writes.
 w.__dev.bridge.active=false;s.scene.pause();
 setTimeout(()=>{
 const before=JSON.stringify(m);s.draw();s.playerArt.image.setVisible(false);
 const art=s.add.image(p.x+s.graphics.x,p.y-m.cameraY,'boss-contact-rebound-candidate').setOrigin(.5).setDisplaySize(48,48);
 s.children.moveAbove(art,s.playerArt.image);
 window.review={method:'Actual bossContact event snapshot; visual override only; not a success-stomp attack',player:{x:p.x,y:p.y,vy:p.vy},hp:m.hp,ammo:m.ammo,damage:m.health.lastDamage,contact:m.boss.contactBox,weak:m.boss.eye,cameraY:m.cameraY,boss:a.state(),sprite:[48,48],modelUnchanged:before===JSON.stringify(m)};
 document.querySelector('#note').textContent='STATIC CONTACT CANDIDATE | HIGH 256 + B | existing damage / bounce / reload | not connected';
 },0);
};
a.restart({weapon:'SHOTGUN',attack:'CLONES',target:'phase1'});
</script></html>
