<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLAYER animation candidates v1</title><style>body{background:#152128;color:#fff0d8;font:15px/1.6 system-ui;margin:24px}h1{font-size:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}article{border:1px solid #53616b;padding:16px}canvas,img{image-rendering:pixelated}canvas{vertical-align:middle;background:#0d151c;margin-right:12px}button{padding:8px}a{color:#ffa978}.sheet{max-width:100%}</style><h1>PLAYER SPRITES v1 — animation candidates</h1><p>35 frames / 15 states・48×48セル。左は等倍、右は3倍。身体の基準点を固定して再生。正式採用前のレビュー用です。</p><button id="pause">一時停止</button> <label><input id="flip" type="checkbox">flipX</label><p><a href="animation-map.json">Animation map</a> · <a href="generation-record.json">Generation record</a> · <a href="previews/contact-sheet.png">Contact sheet</a></p><div class="grid" id="grid"></div><script type="module">
const data=await(await fetch('animation-map.json')).json(),images={};let paused=false,frozen=0,start=performance.now();
for(const [id,f] of Object.entries(data.frames)){const im=new Image;im.src=f.file;await im.decode();images[id]=im;}
const views=[];for(const [state,a]of Object.entries(data.animations)){const article=document.createElement('article');article.innerHTML=`<b>${state.toUpperCase()}</b><p>${a.frames.length} frames / ${a.fps} fps</p><canvas width="64" height="64"></canvas><canvas width="64" height="64" style="width:192px;height:192px"></canvas>`;grid.append(article);views.push({a,canvases:article.querySelectorAll('canvas')});}
pause.onclick=()=>{paused=!paused;if(paused)frozen=performance.now()-start;else start=performance.now()-frozen;pause.textContent=paused?'再生':'一時停止';};
function tick(){const seconds=(paused?frozen:performance.now()-start)/1000;for(const {a,canvases}of views){const duration=a.frames.length/a.fps;const t=seconds%(duration+(a.loop?0:.7));const index=a.loop?Math.floor(t*a.fps)%a.frames.length:Math.min(a.frames.length-1,Math.floor(t*a.fps));const id=a.frames[index],f=data.frames[id];for(const c of canvases){const ctx=c.getContext('2d');ctx.clearRect(0,0,64,64);ctx.imageSmoothingEnabled=false;ctx.save();ctx.translate(32,30);if(flip.checked)ctx.scale(-1,1);ctx.drawImage(images[id],-f.anchor.x,-f.anchor.y);ctx.restore();}}requestAnimationFrame(tick)}tick();
</script></html>
